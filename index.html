<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CavaloGameNews</title>
  <style>
    .search-box {
  margin-top: 18px;
}

.search-box input {
  width: 100%;
  max-width: 450px;
  padding: 12px 16px;
  border: 1px solid #333;
  border-radius: 8px;
  background: #1b1b1b;
  color: #fff;
  font-size: 15px;
  outline: none;
}

.search-box input:focus {
  border-color: #00ff88;
}

.search-box input::placeholder {
  color: #888;
}
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
    body { background:#111; color:#fff; }
    header { background:#1a1a1a; padding:20px; border-bottom:3px solid #00ff88; }
    header h1 { color:#00ff88; }
    nav { margin-top:10px; display:flex; gap:16px; flex-wrap:wrap; }
    nav a { color:#fff; text-decoration:none; font-weight:bold; }
    .hero { background:linear-gradient(90deg,#00ff88,#007744); padding:40px 20px; text-align:center; color:#111; }
    .container { width:90%; max-width:1100px; margin:30px auto; }
    .news-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; }
    .card { background:#1b1b1b; border:1px solid #333; border-radius:12px; overflow:hidden; }
    .card img { width:100%; height:170px; object-fit:cover; }
    .card-content { padding:15px; }
    .category { color:#00ff88; font-size:12px; font-weight:bold; text-transform:uppercase; }
    .date { color:#aaa; font-size:12px; margin:6px 0 12px; }
    .card h3 { margin-bottom:10px; }
    footer { background:#1a1a1a; text-align:center; padding:20px; margin-top:40px; color:#aaa; }
    .featured-link {
  text-decoration: none;
  color: inherit;
  display: block;
}

.featured {
  position: relative;
  height: 430px;
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 30px;
  background: #1b1b1b;
}

.featured img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.featured-overlay {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 35px;
  background: linear-gradient(
    transparent,
    rgba(0,0,0,0.95)
  );
}

.featured-overlay h2 {
  font-size: 34px;
  margin: 10px 0;
  max-width: 800px;
}

.featured-overlay p {
  color: #ddd;
  max-width: 700px;
  margin-bottom: 15px;
}

.read-button {
  display: inline-block;
  background: #00ff88;
  color: #111;
  padding: 10px 18px;
  border-radius: 6px;
  font-weight: bold;
}

.featured:hover img {
  transform: scale(1.03);
  transition: 0.3s;
}

@media (max-width: 600px) {
  .featured {
    height: 380px;
  }

  .featured-overlay {
    padding: 20px;
  }

  .featured-overlay h2 {
    font-size: 24px;
  }
}
    .search-box {
  margin-bottom: 25px;
}

.search-box input {
  width: 100%;
  padding: 15px 18px;
  background: #1b1b1b;
  color: #fff;
  border: 1px solid #333;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

.search-box input:focus {
  border-color: #00ff88;
}

.search-box input::placeholder {
  color: #888;
}
  </style>
</head>
<body>

<header>
  <img src="img/logo.svg" alt="CavaloGameNews" style="height:64px;">
  <nav>
    <div class="search-box">
  <input
    type="text"
    id="searchInput"
    placeholder="🔎 Buscar notícia..."
    onkeyup="buscarNoticias()"
  >
</div>
  <a href="#" onclick="filtrarNoticias('todos'); return false;">Início</a>
  <a href="#" onclick="filtrarNoticias('Xbox'); return false;">Xbox</a>
  <a href="#" onclick="filtrarNoticias('PlayStation'); return false;">PlayStation</a>
  <a href="#" onclick="filtrarNoticias('PC'); return false;">PC</a>
  <a href="#" onclick="filtrarNoticias('Mobile'); return false;">Mobile</a>
  <a href="#" onclick="filtrarNoticias('Novidades'); return false;">Novidades</a>
</nav>
</header>

<section class="hero">
  <h2>As maiores notícias do mundo gamer em um só lugar</h2>
  <p>Xbox, PlayStation, PC, Nintendo e muito mais.</p>
</section>

<div class="container">
  <div class="search-box">
  <input
    type="text"
    id="searchInput"
    placeholder="🔎 Pesquisar notícia..."
  >
</div>

  <div id="featured"></div>

  <h2 style="margin:30px 0 20px;color:#00ff88;">Últimas Notícias</h2>

  <div id="news" class="news-grid"></div>

</div>

<footer>
  © 2026 CavaloGameNews - Todos os direitos reservados.
</footer>

<script>
fetch("posts.json")
  .then(r => r.json())
  .then(posts => {

    const featured = document.getElementById("featured");
    const container = document.getElementById("news");

    // Primeira notícia = destaque
    if (posts.length > 0) {

      const principal = posts[0];

      featured.innerHTML = `
        <a href="post.html?id=${principal.id}" class="featured-link">
          <article class="featured">

            <img src="${principal.imagem}" alt="${principal.titulo}">

            <div class="featured-overlay">

              <span class="category">${principal.categoria}</span>

              <h2>${principal.titulo}</h2>

              <div class="date">${principal.data}</div>

              <p>${principal.resumo}</p>

              <span class="read-button">LER NOTÍCIA →</span>

            </div>

          </article>
        </a>
      `;
    }

    // Restante das notícias
    posts.slice(1).forEach(post => {

      container.innerHTML += `
        <a href="post.html?id=${post.id}" style="text-decoration:none;color:inherit;">

          <div class="card">

            <img src="${post.imagem}" alt="${post.titulo}">

            <div class="card-content">

              <div class="category">${post.categoria}</div>

              <div class="date">${post.data}</div>

              <h3>${post.titulo}</h3>

              <p>${post.resumo}</p>

            </div>

          </div>

        </a>
      `;

    });

  })
  .catch(() => {

    document.getElementById("news").innerHTML =
      "<p>Nenhuma notícia encontrada.</p>";

  });
  document.getElementById("searchInput").addEventListener("input", function () {

  const termo = this.value.toLowerCase().trim();
  const cards = document.querySelectorAll("#news > a");

  cards.forEach(card => {

    const texto = card.textContent.toLowerCase();

    if (texto.includes(termo)) {
      card.style.display = "";
    } else {
      card.style.display = "none";
    }

  });

});
  function filtrarNoticias(categoria) {

  const container = document.getElementById("news");
  const featured = document.getElementById("featured");

  // Início: mostra tudo novamente
  if (categoria === "todos") {
    location.reload();
    return;
  }

  // Esconde a notícia principal
  featured.innerHTML = "";

  container.innerHTML = "";

  fetch("posts.json")
    .then(r => r.json())
    .then(posts => {

      const filtradas = posts.filter(post =>
        post.categoria.toLowerCase() === categoria.toLowerCase()
      );

      if (filtradas.length === 0) {
        container.innerHTML = "<p>Nenhuma notícia encontrada nessa categoria.</p>";
        return;
      }

      filtradas.forEach(post => {

        container.innerHTML += `
          <a href="post.html?id=${post.id}" style="text-decoration:none;color:inherit;">

            <div class="card">

              <img src="${post.imagem}" alt="${post.titulo}">

              <div class="card-content">

                <div class="category">${post.categoria}</div>

                <div class="date">${post.data}</div>

                <h3>${post.titulo}</h3>

                <p>${post.resumo}</p>

              </div>

            </div>

          </a>
        `;

      });

    });
}
  function buscarNoticias() {

  const termo = document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  const container = document.getElementById("news");
  const featured = document.getElementById("featured");

  featured.innerHTML = "";
  container.innerHTML = "";

  fetch("posts.json")
    .then(r => r.json())
    .then(posts => {

      const resultados = posts.filter(post =>
        post.titulo.toLowerCase().includes(termo) ||
        post.resumo.toLowerCase().includes(termo) ||
        post.categoria.toLowerCase().includes(termo)
      );

      if (resultados.length === 0) {
        container.innerHTML = "<p>Nenhuma notícia encontrada.</p>";
        return;
      }

      resultados.forEach(post => {

        container.innerHTML += `
          <a href="${post.link}" style="text-decoration:none;color:inherit;">
            <div class="card">

              <img src="${post.imagem}" alt="${post.titulo}">

              <div class="card-content">

                <div class="category">${post.categoria}</div>

                <div class="date">${post.data}</div>

                <h3>${post.titulo}</h3>

                <p>${post.resumo}</p>

              </div>

            </div>
          </a>
        `;

      });

    });
}
</script>

</body>
</html>

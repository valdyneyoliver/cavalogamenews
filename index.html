  /* =====================================================
     RENDERIZAR CALENDÁRIO
  ===================================================== */

  function renderizarLancamentos(lista) {

    if (!releaseContainer) return;


    if (!lista.length) {

      releaseContainer.innerHTML = `
        <div class="release-empty">
          🎮 Nenhum lançamento encontrado.
        </div>
      `;

      return;
    }


    releaseContainer.innerHTML =
      lista.map(jogo => {

        const plataformas =
          Array.isArray(jogo.plataformas)
            ? jogo.plataformas
            : [];


        const plataformasHTML =
          plataformas.map(plataforma => {

            const classe =
              classePlataforma(plataforma);

            return `
              <span
                class="release-platform ${classe}"
              >
                ${escapeReleaseHTML(plataforma)}
              </span>
            `;

          }).join("");


        return `

          <a
            class="release-card"
            href="${escapeReleaseHTML(jogo.link_rawg || "#")}"
            target="_blank"
            rel="noopener noreferrer"
          >

            <img
              class="release-image"
              src="${escapeReleaseHTML(jogo.imagem || "")}"
              alt="${escapeReleaseHTML(jogo.nome || "Jogo")}"
              loading="lazy"
            >


            <div class="release-date">
              📅 ${escapeReleaseHTML(jogo.data_formatada || jogo.data || "")}
            </div>


            <div class="release-info">

              <div class="release-name">
                ${escapeReleaseHTML(jogo.nome || "Jogo")}
              </div>


              <div class="release-platforms">
                ${plataformasHTML}
              </div>

            </div>

          </a>

        `;

      }).join("");
  }


  /* =====================================================
     FILTRAR CALENDÁRIO
  ===================================================== */

  function filtrarLancamentos(plataforma) {

    if (plataforma === "todos") {

      renderizarLancamentos(releaseGames);

      return;
    }


    const filtrados =
      releaseGames.filter(jogo => {

        const plataformas =
          Array.isArray(jogo.plataformas)
            ? jogo.plataformas
            : [];


        return plataformas.some(item =>
          String(item)
            .toLowerCase()
            .includes(plataforma.toLowerCase())
        );

      });


    renderizarLancamentos(filtrados);
  }


  /* =====================================================
     CARREGAR LANÇAMENTOS
  ===================================================== */

  function carregarLancamentos() {

    if (!releaseContainer) return;


    fetch("lancamentos.json")

      .then(response => {

        if (!response.ok) {

          throw new Error(
            "Não foi possível carregar lancamentos.json"
          );

        }

        return response.json();

      })

      .then(data => {

        releaseGames =
          Array.isArray(data.jogos)
            ? data.jogos
            : [];


        releaseGames =
          releaseGames.filter(jogo =>
            jogo &&
            jogo.nome &&
            jogo.data
          );


        releaseGames.sort((a, b) => {

          return String(a.data)
            .localeCompare(String(b.data));

        });


        releaseGames =
          releaseGames.slice(0, 100);


        renderizarLancamentos(releaseGames);

      })

      .catch(error => {

        console.error(
          "Erro no calendário:",
          error
        );


        releaseContainer.innerHTML = `

          <div class="release-error">
            ⚠️ Não foi possível carregar
            o calendário de lançamentos.
          </div>

        `;

      });

  }

  /* =====================================================
     NOTÍCIAS
  ===================================================== */

  let todasNoticias = [];

  let noticiasExibidas = 0;

  const noticiasPorPagina = 12;


  function linkDaNoticia(post) {

    return "noticias/" + post.id + ".html";

  }


  function escaparHTML(texto) {

    const div =
      document.createElement("div");

    div.textContent =
      texto || "";

    return div.innerHTML;

  }


  function carregarNoticias() {

    fetch("posts.json")

      .then(response => {

        if (!response.ok) {

          throw new Error(
            "Erro ao carregar posts.json"
          );

        }

        return response.json();

      })

      .then(posts => {

        if (!Array.isArray(posts)) {

          throw new Error(
            "posts.json inválido"
          );

        }


        todasNoticias = posts;


        todasNoticias.sort((a, b) => {

          const dataA =
            String(a.data || "");

          const dataB =
            String(b.data || "");


          return dataB.localeCompare(dataA);

        });


        noticiasExibidas = 0;


        filtrarNoticias("todos");

      })

      .catch(error => {

        console.error(
          "Erro ao carregar notícias:",
          error
        );


        const news =
          document.getElementById("news");


        if (news) {

          news.innerHTML = `

            <p style="
              color:#888;
              text-align:center;
              padding:30px;
            ">
              ⚠️ Nenhuma notícia encontrada.
            </p>

          `;

        }

      });

  }


  /* =====================================================
     FILTRAR NOTÍCIAS
  ===================================================== */

  function filtrarNoticias(categoria) {

    const titulo =
      document.getElementById("tituloNoticias");


    let noticiasFiltradas;


    if (categoria === "todos") {

      noticiasFiltradas =
        todasNoticias;

      if (titulo) {

        titulo.textContent =
          "Últimas Notícias";

      }

    } else {

      noticiasFiltradas =
        todasNoticias.filter(post => {

          return String(post.categoria || "")
            .toLowerCase()
            === String(categoria)
              .toLowerCase();

        });


      if (titulo) {

        titulo.textContent =
          categoria;

      }

    }


    noticiasExibidas = 0;


    const news =
      document.getElementById("news");


    if (!news) return;


    news.innerHTML = "";


    const quantidade =
      Math.min(
        noticiasPorPagina,
        noticiasFiltradas.length
      );


    for (
      let i = 0;
      i < quantidade;
      i++
    ) {

      const post =
        noticiasFiltradas[i];


      news.innerHTML += `

        <a
          class="news-link"
          href="${linkDaNoticia(post)}"
        >

          <article class="card">

            <img
              src="${escaparHTML(post.imagem || "")}"
              alt="${escaparHTML(post.titulo || "")}"
              loading="lazy"
            >


            <div class="card-content">

              <div class="category">
                ${escaparHTML(post.categoria || "")}
              </div>


              <div class="date">
                ${escaparHTML(post.data || "")}
              </div>


              <h3>
                ${escaparHTML(post.titulo || "")}
              </h3>


              <p>
                ${escaparHTML(post.resumo || "")}
              </p>

            </div>

          </article>

        </a>

      `;

    }


    noticiasExibidas =
      quantidade;


    atualizarBotaoCarregarMais(
      noticiasFiltradas.length
    );

  }


  /* =====================================================

  function carregarMais() {

    const categoriaAtual =
      document.getElementById("tituloNoticias")
        ?.textContent
        || "Últimas Notícias";


    let noticiasFiltradas;


    if (
      categoriaAtual === "Últimas Notícias"
    ) {

      noticiasFiltradas =
        todasNoticias;

    } else {

      noticiasFiltradas =
        todasNoticias.filter(post => {

          return String(post.categoria || "")
            .toLowerCase()
            === String(categoriaAtual)
              .toLowerCase();

        });

    }


    const news =
      document.getElementById("news");


    if (!news) return;


    const inicio =
      noticiasExibidas;


    const fim =
      Math.min(
        inicio + noticiasPorPagina,
        noticiasFiltradas.length
      );


    for (
      let i = inicio;
      i < fim;
      i++
    ) {

      const post =
        noticiasFiltradas[i];


      news.innerHTML += `

        <a
          class="news-link"

                ${escaparHTML(post.titulo || "")}
              </h3>


              <p>
                ${escaparHTML(post.resumo || "")}
              </p>

            </div>

          </article>

        </a>

      `;

    }


    noticiasExibidas =
      fim;


    atualizarBotaoCarregarMais(
      noticiasFiltradas.length
    );

  }


  function atualizarBotaoCarregarMais(total) {

    const button =
      document.getElementById("loadMoreButton");


    if (!button) return;


    if (noticiasExibidas < total) {

      button.style.display =
        "inline-block";

    } else {

      button.style.display =
        "none";

    }

  }


  /* =====================================================

  ===================================================== */

  function buscarNoticias() {

    const input =
      document.getElementById("searchInput");


    const termo =
      String(input?.value || "")
        .toLowerCase()
        .trim();


    const news =
      document.getElementById("news");


    const titulo =
      document.getElementById("tituloNoticias");


    if (!news) return;


    if (!termo) {

      filtrarNoticias("todos");

      return;

    }


    const resultados =
      todasNoticias.filter(post => {

        const texto = [

          post.titulo,
          post.resumo,
          post.categoria

        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


        return texto.includes(termo);

      });


    if (titulo) {

      titulo.textContent =
        "Resultados da busca";

    }


    news.innerHTML = "";


    resultados.forEach(post => {

      news.innerHTML += `

        <a
          class="news-link"
          href="${linkDaNoticia(post)}"
        >

          <article class="card">

            <img
              src="${escaparHTML(post.imagem || "")}"
              alt="${escaparHTML(post.titulo || "")}"
              loading="lazy"
            >


            <div class="card-content">

              <div class="category">
                ${escaparHTML(post.categoria || "")}
              </div>


              <div class="date">
                ${escaparHTML(post.data || "")}
              </div>


              <h3>
                ${escaparHTML(post.titulo || "")}
              </h3>


              <p>
                ${escaparHTML(post.resumo || "")}
              </p>

            </div>

          </article>

        </a>

      `;

    });


    noticiasExibidas =
      resultados.length;


    atualizarBotaoCarregarMais(
      resultados.length
    );

  }

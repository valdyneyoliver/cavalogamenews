<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CavaloGameNews</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
    body { background:#111; color:#fff; }
    header { background:#1a1a1a; padding:20px; border-bottom:3px solid #00ff88; }
    header h1 { color:#00ff88; }
    nav { margin-top:10px; display:flex; gap:16px; flex-wrap:wrap; }
    nav a { color:#fff; text-decoration:none; font-weight:bold; }
    .hero { background:linear-gradient(90deg,#00ff88,#007744); padding:40px 20px; text-align:center; color:#111; }
    .container { width:90%; max-width:1100px; margin:30px auto; }
    .news-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; }
    .card { background:#1b1b1b; border:1px solid #333; border-radius:12px; overflow:hidden; }
    .card img { width:100%; height:170px; object-fit:cover; }
    .card-content { padding:15px; }
    .category { color:#00ff88; font-size:12px; font-weight:bold; text-transform:uppercase; }
    .date { color:#aaa; font-size:12px; margin:6px 0 12px; }
    .card h3 { margin-bottom:10px; }
    footer { background:#1a1a1a; text-align:center; padding:20px; margin-top:40px; color:#aaa; }
  </style>
</head>
<body>

<header style="background:#0f1115;padding:20px 30px;border-bottom:3px solid #00ff88;">
  <div style="display:flex;align-items:center;gap:12px;">
  <img src="img/logo.svg" alt="CavaloGameNews" style="height:64px;">

  <header style="background:#0f1115;padding:20px 30px;border-bottom:3px solid #00ff88;">
  <div style="display:flex;align-items:center;gap:12px;">
    <img src="img/logo-icon.png" alt="CavaloGameNews"
         style="width:64px;height:64px;object-fit:cover;border-radius:50%;display:block;">
    <h1 style="margin:0;font-size:32px;color:#fff;">
      Cavalo<span style="color:#00ff88;">Game</span>News
    </h1>
  </div>

  <nav style="margin-top:15px;display:flex;gap:20px;flex-wrap:wrap;">
    <a href="#" style="color:#fff;text-decoration:none;font-weight:bold;">Início</a>
    <a href="#" style="color:#fff;text-decoration:none;font-weight:bold;">Xbox</a>
    <a href="#" style="color:#fff;text-decoration:none;font-weight:bold;">PlayStation</a>
    <a href="#" style="color:#fff;text-decoration:none;font-weight:bold;">PC</a>
    <a href="#" style="color:#fff;text-decoration:none;font-weight:bold;">Mobile</a>
    <a href="#" style="color:#fff;text-decoration:none;font-weight:bold;">EA FC</a>
  </nav>
</header>

<section class="hero">
  <h2>As maiores notícias do mundo gamer em um só lugar</h2>
  <p>Xbox, PlayStation, PC, Nintendo e muito mais.</p>
</section>

<div class="container">
  <h2 style="margin-bottom:20px;color:#00ff88;">Últimas Notícias</h2>
  <div id="news" class="news-grid"></div>
</div>

<footer>
  © 2026 CavaloGameNews - Todos os direitos reservados.
</footer>

<script>
fetch("posts.json")
  .then(r => r.json())
  .then(posts => {
    const container = document.getElementById("news");
    posts.forEach(post => {
      container.innerHTML += `
        <a href="${post.link}" style="text-decoration:none;color:inherit;">
  <div class="card">
          <img src="${post.imagem}" alt="${post.titulo}">
          <div class="card-content">
            <div class="category">${post.categoria}</div>
            <div class="date">${post.data}</div>
            <h3>${post.titulo}</h3>
            <p>${post.resumo}</p>
          </div>
        </div>
        </a>
      `;
    });
  })
  .catch(() => {
    document.getElementById("news").innerHTML = "<p>Nenhuma notícia encontrada.</p>";
  });
</script>

</body>
</html>

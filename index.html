  <h2

<script>


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const NOTICIAS_POR_VEZ = 24;

let todasNoticias = [];

let noticiasAtuais = [];

let quantidadeExibida = 0;


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(texto) {

  const div = document.createElement("div");

  div.textContent = texto ?? "";

  return div.innerHTML;

}


/* =====================================================
   CRIAR CARD
===================================================== */

function criarCard(post) {

  return `

    <a
      href="post.html?id=${encodeURIComponent(post.id)}"
      class="news-link"
    >

      <div class="card">

        <img
          src="${escaparHTML(post.imagem)}"
          alt="${escaparHTML(post.titulo)}"
          loading="lazy"
        >

        <div class="card-content">

          <div class="category">
            ${escaparHTML(post.categoria)}
          </div>


          <div class="date">
            ${escaparHTML(post.data)}
          </div>


          <h3>
            ${escaparHTML(post.titulo)}
          </h3>


          <p>
            ${escaparHTML(post.resumo)}
          </p>

        </div>

      </div>

    </a>

  `;

}


/* =====================================================
   MOSTRAR / ESCONDER BOTÃO
===================================================== */

function atualizarBotao() {

  const botao =
    document.getElementById("loadMoreButton");


  if (
    quantidadeExibida <
    noticiasAtuais.length
  ) {

    botao.style.display = "inline-block";

  } else {

    botao.style.display = "none";

  }

}


/* =====================================================
   RENDERIZAR NOTÍCIAS
===================================================== */

function renderizarNoticias(reset = true) {

  const container =
    document.getElementById("news");


  if (reset) {

    container.innerHTML = "";

    quantidadeExibida = 0;

  }


  const proximaQuantidade =
    Math.min(
      quantidadeExibida + NOTICIAS_POR_VEZ,
      noticiasAtuais.length
    );


  let html = "";


  for (
    let i = quantidadeExibida;
    i < proximaQuantidade;
    i++
  ) {

    html += criarCard(
      noticiasAtuais[i]
    );

  }


  container.insertAdjacentHTML(
    "beforeend",
    html
  );


  quantidadeExibida =
    proximaQuantidade;


  atualizarBotao();

}


/* =====================================================
   CARREGAR MAIS
===================================================== */

function carregarMais() {

  renderizarNoticias(false);

}


/* =====================================================
   CARREGAR NOTÍCIAS
===================================================== */

function carregarNoticias() {

  fetch("posts.json")

    .then(response => {

      if (!response.ok) {

        throw new Error(
          "Erro ao carregar posts.json"
        );

      }

      return response.json();

    })


    .then(posts => {

      todasNoticias = posts;

      noticiasAtuais = posts;


      const featured =
        document.getElementById(
          "featured"
        );


      const container =
        document.getElementById(
          "news"
        );


      featured.innerHTML = "";

      container.innerHTML = "";


      /* =========================
         NOTÍCIA PRINCIPAL
      ========================= */

      if (posts.length > 0) {

        const principal =
          posts[0];


        featured.innerHTML = `

          <a
            href="post.html?id=${encodeURIComponent(principal.id)}"
            class="featured-link"
          >

            <article class="featured">

              <img
                src="${escaparHTML(principal.imagem)}"
                alt="${escaparHTML(principal.titulo)}"
              >


              <div class="featured-overlay">

                <span class="category">
                  ${escaparHTML(principal.categoria)}
                </span>


                <h2>
                  ${escaparHTML(principal.titulo)}
                </h2>


                <div class="date">
                  ${escaparHTML(principal.data)}
                </div>


                <p>
                  ${escaparHTML(principal.resumo)}
                </p>


                <span class="read-button">
                  LER NOTÍCIA →
                </span>

              </div>

            </article>

          </a>

        `;

      }


      /* =========================
         NOTÍCIAS
      ========================= */

      noticiasAtuais =
        posts.slice(1);


      renderizarNoticias(true);

    })


    .catch(error => {

      console.error(error);


      document.getElementById(
        "news"
      ).innerHTML = `

        <p>
          Nenhuma notícia encontrada.
        </p>

      `;

    });

}


/* =====================================================
   FILTRAR CATEGORIA
===================================================== */

function filtrarNoticias(categoria) {

  const titulo =
    document.getElementById(
      "tituloNoticias"
    );


  const featured =
    document.getElementById(
      "featured"
    );


  const container =
    document.getElementById(
      "news"
    );


  /* =========================
     VOLTAR PARA TODAS
  ========================= */

  if (categoria === "todos") {

    titulo.textContent =
      "Últimas Notícias";


    carregarNoticias();

    return;

  }


  titulo.textContent =
    "Notícias de " + categoria;


  featured.innerHTML = "";

  container.innerHTML = "";


  fetch("posts.json")

    .then(response =>
      response.json()
    )


    .then(posts => {

      const filtradas =
        posts.filter(post =>

          String(
            post.categoria || ""
          ).toLowerCase() ===
          categoria.toLowerCase()

        );


      if (
        filtradas.length === 0
      ) {

        noticiasAtuais = [];

        quantidadeExibida = 0;

        atualizarBotao();


        container.innerHTML = `

          <p>
            Nenhuma notícia encontrada nessa categoria.
          </p>

        `;

        return;

      }


      noticiasAtuais =
        filtradas;


      renderizarNoticias(true);

    })


    .catch(() => {

      container.innerHTML = `

        <p>
          Erro ao carregar notícias.
        </p>

      `;

    });

}


/* =====================================================
   BUSCAR NOTÍCIAS
===================================================== */

function buscarNoticias() {

  const termo =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  const container =
    document.getElementById(
      "news"
    );


  const featured =
    document.getElementById(
      "featured"
    );


  /* =========================
     BUSCA VAZIA
  ========================= */

  if (termo === "") {

    carregarNoticias();

    return;

  }


  featured.innerHTML = "";

  container.innerHTML = "";


  fetch("posts.json")

    .then(response =>
      response.json()
    )


    .then(posts => {

      const resultados =
        posts.filter(post => {

          const titulo =
            String(
              post.titulo || ""
            ).toLowerCase();


          const resumo =
            String(
              post.resumo || ""
            ).toLowerCase();


          const categoria =
            String(
              post.categoria || ""
            ).toLowerCase();


          return (
            titulo.includes(termo) ||
            resumo.includes(termo) ||
            categoria.includes(termo)
          );

        });


      if (
        resultados.length === 0
      ) {

        noticiasAtuais = [];

        quantidadeExibida = 0;

        atualizarBotao();


        container.innerHTML = `

          <p>
            Nenhuma notícia encontrada.
          </p>

        `;

        return;

      }


      noticiasAtuais =
        resultados;


      renderizarNoticias(true);

    })


    .catch(() => {

      container.innerHTML = `

        <p>
          Erro ao pesquisar notícias.
        </p>

      `;

    });

}


/* =====================================================
   INICIAR SITE
===================================================== */

carregarNoticias();


</script>


</body>

</html>

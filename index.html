<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CavaloGameNews</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: #fff;
    }

    header {
      background: #1a1a1a;
      padding: 20px;
      border-bottom: 3px solid #00ff88;
    }

    header img {
      height: 64px;
      display: block;
    }

    nav {
      margin-top: 15px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #00ff88;
    }

    /* BUSCA */

    .search-box {
      width: 100%;
      margin-bottom: 5px;
    }

    .search-box input {
      width: 100%;
      max-width: 450px;
      padding: 12px 16px;
      background: #1b1b1b;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #00ff88;
    }

    .search-box input::placeholder {
      color: #888;
    }

    /* HERO */

    .hero {
      background: linear-gradient(90deg, #00ff88, #007744);
      padding: 40px 20px;
      text-align: center;
      color: #111;
    }

    .hero h2 {
      margin-bottom: 10px;
    }

    /* CONTAINER */

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 30px auto;
    }

    /* NOTÍCIA PRINCIPAL */

    .featured-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .featured {
      position: relative;
      height: 430px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 30px;
      background: #1b1b1b;
    }

    .featured img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: 0.3s;
    }

    .featured-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 35px;
      background: linear-gradient(
        transparent,
        rgba(0, 0, 0, 0.95)
      );
    }

    .featured-overlay h2 {
      font-size: 34px;
      margin: 10px 0;
      max-width: 800px;
    }

    .featured-overlay p {
      color: #ddd;
      max-width: 700px;
      margin-bottom: 15px;
    }

    .read-button {
      display: inline-block;
      background: #00ff88;
      color: #111;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
    }

    .featured:hover img {
      transform: scale(1.03);
    }

    /* NOTÍCIAS */

    .news-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(260px, 1fr)
      );
      gap: 20px;
    }

    .news-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 12px;
      overflow: hidden;
      transition: 0.2s;
    }

    .card:hover {
      border-color: #00ff88;
      transform: translateY(-3px);
    }

    .card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 15px;
    }

    .category {
      color: #00ff88;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .date {
      color: #aaa;
      font-size: 12px;
      margin: 6px 0 12px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #ccc;
      line-height: 1.5;
    }

    /* RODAPÉ */

    footer {
      background: #1a1a1a;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      color: #aaa;
    }

    /* CELULAR */

    @media (max-width: 600px) {

      .featured {
        height: 380px;
      }

      .featured-overlay {
        padding: 20px;
      }

      .featured-overlay h2 {
        font-size: 24px;
      }

      nav {
        gap: 12px;
      }
    }
  </style>
</head>

<body>

<header>

  <img
    src="img/logo.svg"
    alt="CavaloGameNews"
  >

  <nav>

    <!-- BUSCA -->
    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="🔎 Buscar notícia..."
        onkeyup="buscarNoticias()"
      >
    </div>

    <!-- CATEGORIAS -->

    <a
      href="#"
      onclick="filtrarNoticias('todos'); return false;"
    >
      Início
    </a>

    <a
      href="#"
      onclick="filtrarNoticias('Xbox'); return false;"
    >
      Xbox
    </a>

    <a
      href="#"
      onclick="filtrarNoticias('PlayStation'); return false;"
    >
      PlayStation
    </a>

    <a
      href="#"
      onclick="filtrarNoticias('PC'); return false;"
    >
      PC
    </a>

    <a
      href="#"
      onclick="filtrarNoticias('Mobile'); return false;"
    >
      Mobile
    </a>

    <a
      href="#"
      onclick="filtrarNoticias('Novidades'); return false;"
    >
      Novidades
    </a>

  </nav>

</header>

<!-- HERO -->

<section class="hero">

  <h2>
    As maiores notícias do mundo gamer em um só lugar
  </h2>

  <p>
    Xbox, PlayStation, PC, Nintendo e muito mais.
  </p>

</section>

<!-- CONTEÚDO -->

<div class="container">

  <!-- NOTÍCIA PRINCIPAL -->

  <div id="featured"></div>

  <!-- TÍTULO -->

  <h2
    style="
      margin:30px 0 20px;
      color:#00ff88;
    "
  >
    Últimas Notícias
  </h2>

  <!-- NOTÍCIAS -->

  <div
    id="news"
    class="news-grid"
  ></div>

</div>

<!-- RODAPÉ -->

<footer>

  © 2026 CavaloGameNews -
  Todos os direitos reservados.

</footer>


<script>

/* =========================
   CARREGAR NOTÍCIAS
========================= */

function carregarNoticias() {

  fetch("posts.json")

    .then(response => {

      if (!response.ok) {
        throw new Error("Erro ao carregar posts.json");
      }

      return response.json();

    })

    .then(posts => {

      const featured =
        document.getElementById("featured");

      const container =
        document.getElementById("news");


      featured.innerHTML = "";
      container.innerHTML = "";


      /* =========================
         NOTÍCIA PRINCIPAL
      ========================= */

      if (posts.length > 0) {

        const principal = posts[0];

        featured.innerHTML = `

          <a
            href="post.html?id=${principal.id}"
            class="featured-link"
          >

            <article class="featured">

              <img
                src="${principal.imagem}"
                alt="${principal.titulo}"
              >

              <div class="featured-overlay">

                <span class="category">
                  ${principal.categoria}
                </span>

                <h2>
                  ${principal.titulo}
                </h2>

                <div class="date">
                  ${principal.data}
                </div>

                <p>
                  ${principal.resumo}
                </p>

                <span class="read-button">
                  LER NOTÍCIA →
                </span>

              </div>

            </article>

          </a>

        `;

      }


      /* =========================
         RESTANTE DAS NOTÍCIAS
      ========================= */

      posts.slice(1).forEach(post => {

        container.innerHTML += `

          <a
            href="post.html?id=${post.id}"
            class="news-link"
          >

            <div class="card">

              <img
                src="${post.imagem}"
                alt="${post.titulo}"
              >

              <div class="card-content">

                <div class="category">
                  ${post.categoria}
                </div>

                <div class="date">
                  ${post.data}
                </div>

                <h3>
                  ${post.titulo}
                </h3>

                <p>
                  ${post.resumo}
                </p>

              </div>

            </div>

          </a>

        `;

      });

    })

    .catch(error => {

      console.error(error);

      document.getElementById("news").innerHTML = `
        <p>
          Nenhuma notícia encontrada.
        </p>
      `;

    });

}


/* =========================
   FILTRAR CATEGORIA
========================= */

function filtrarNoticias(categoria) {

  const container =
    document.getElementById("news");

  const featured =
    document.getElementById("featured");


  /* VOLTAR PARA TODAS */

  if (categoria === "todos") {

    carregarNoticias();

    return;

  }


  featured.innerHTML = "";

  container.innerHTML = "";


  fetch("posts.json")

    .then(response => response.json())

    .then(posts => {

      const filtradas =
        posts.filter(post =>
          post.categoria.toLowerCase() ===
          categoria.toLowerCase()
        );


      if (filtradas.length === 0) {

        container.innerHTML = `
          <p>
            Nenhuma notícia encontrada nessa categoria.
          </p>
        `;

        return;

      }


      filtradas.forEach(post => {

        container.innerHTML += `

          <a
            href="post.html?id=${post.id}"
            class="news-link"
          >

            <div class="card">

              <img
                src="${post.imagem}"
                alt="${post.titulo}"
              >

              <div class="card-content">

                <div class="category">
                  ${post.categoria}
                </div>

                <div class="date">
                  ${post.data}
                </div>

                <h3>
                  ${post.titulo}
                </h3>

                <p>
                  ${post.resumo}
                </p>

              </div>

            </div>

          </a>

        `;

      });

    })

    .catch(() => {

      container.innerHTML = `
        <p>
          Erro ao carregar notícias.
        </p>
      `;

    });

}


/* =========================
   BUSCAR NOTÍCIAS
========================= */

function buscarNoticias() {

  const termo =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  const container =
    document.getElementById("news");

  const featured =
    document.getElementById("featured");


  /* SE ESTIVER VAZIO */

  if (termo === "") {

    carregarNoticias();

    return;

  }


  featured.innerHTML = "";

  container.innerHTML = "";


  fetch("posts.json")

    .then(response => response.json())

    .then(posts => {

      const resultados =
        posts.filter(post =>

          post.titulo
            .toLowerCase()
            .includes(termo)

          ||

          post.resumo
            .toLowerCase()
            .includes(termo)

          ||

          post.categoria
            .toLowerCase()
            .includes(termo)

        );


      if (resultados.length === 0) {

        container.innerHTML = `
          <p>
            Nenhuma notícia encontrada.
          </p>
        `;

        return;

      }


      resultados.forEach(post => {

        container.innerHTML += `

          <a
            href="post.html?id=${post.id}"
            class="news-link"
          >

            <div class="card">

              <img
                src="${post.imagem}"
                alt="${post.titulo}"
              >

              <div class="card-content">

                <div class="category">
                  ${post.categoria}
                </div>

                <div class="date">
                  ${post.data}
                </div>

                <h3>
                  ${post.titulo}
                </h3>

                <p>
                  ${post.resumo}
                </p>

              </div>

            </div>

          </a>

        `;

      });

    })

    .catch(() => {

      container.innerHTML = `
        <p>
          Erro ao pesquisar notícias.
        </p>
      `;

    });

}


/* =========================
   INICIAR SITE
========================= */

carregarNoticias();

</script>

</body>
</html>

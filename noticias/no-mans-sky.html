   VÍDEOS
============================== */

.videos-container {

    width: 100%;

    max-width: 1000px;

    margin: 30px auto;

}


.video-container {

    width: 100%;

    aspect-ratio: 16 / 9;

    margin-bottom: 30px;

    border-radius: 14px;

    overflow: hidden;

    background: #000;

}


.video-container iframe {

    width: 100%;

    height: 100%;

    border: 0;

    display: block;

}


.video-container video {

    width: 100%;

    height: 100%;

    display: block;

    background: #000;

    object-fit: contain;

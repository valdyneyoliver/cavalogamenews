<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CavaloGameNews</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: #fff;
    }

    header {
      background: #0f1115;
      padding: 20px 30px;
      border-bottom: 3px solid #00ff88;
    }

    header a {
      color: #00ff88;
      text-decoration: none;
      font-weight: bold;
    }

    header a:hover {
      color: #fff;
    }

    .article {
      width: 90%;
      max-width: 1000px;
      margin: 40px auto;
    }

    .category {
      color: #00ff88;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 46px;
      line-height: 1.15;
      margin-bottom: 15px;
    }

    .info {
      color: #999;
      margin-bottom: 25px;
    }

    .cover {
      width: 100%;
      max-height: 560px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      margin-bottom: 30px;
    }

    /* =========================
       RESUMO
    ========================= */

    .summary {
      color: #ccc;
      font-size: 19px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    /* =========================
       VÍDEOS
    ========================= */

    .videos-container {
      width: 100%;
      margin: 30px 0;
    }

    .video-container {
      width: 100%;
      margin-bottom: 30px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
    }

    .video-container iframe,
    .video-container video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .video-container video {
      object-fit: contain;
    }

    /* =========================
       TEXTO
    ========================= */

    .text {
      max-width: 800px;
      margin: auto;
    }

    .text p {
      color: #ddd;
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    /* =========================
       BOTÃO VOLTAR
    ========================= */

    .back-button {
      display: inline-block;
      margin-top: 20px;
      background: #00ff88;
      color: #111;
      padding: 12px 20px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }

    .back-button:hover {
      background: #00cc6d;
    }

    /* =========================
       MAIS NOTÍCIAS
    ========================= */

    .related {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid #333;
    }

    .related h2 {
      color: #00ff88;
      margin-bottom: 20px;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
      );
      gap: 20px;
    }

    .related-card {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      display: block;
      transition: 0.2s;
    }

    .related-card:hover {
      border-color: #00ff88;
      transform: translateY(-3px);
    }

    .related-card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
    }

    .related-content {
      padding: 12px;
    }

    .related-content h3 {
      font-size: 17px;
      margin-top: 6px;
      line-height: 1.4;
    }

    /* =========================
       RODAPÉ
    ========================= */

    footer {
      background: #1a1a1a;
      text-align: center;
      padding: 25px;
      margin-top: 50px;
      color: #888;
    }

    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 600px) {

      h1 {
        font-size: 30px;
      }

      .article {
        width: 92%;
      }

      .text p {
        font-size: 16px;
      }

      .summary {
        font-size: 17px;
      }

    }

  </style>
</head>

<body>

<header>

  <a href="index.html">
    ← Voltar para o CavaloGameNews
  </a>

</header>


<main class="article" id="article">

  <p>Carregando notícia...</p>

</main>


<footer>

  © 2026 CavaloGameNews - Todos os direitos reservados.

</footer>


<script>

/* =========================
   PEGAR ID DA NOTÍCIA
========================= */

const params = new URLSearchParams(
  window.location.search
);

const id = params.get("id");


/* =========================
   TRANSFORMAR TEXTO EM HTML SEGURO
========================= */

function escaparHTML(texto) {

  if (texto === null || texto === undefined) {
    return "";
  }

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   YOUTUBE
========================= */

function pegarYoutubeID(video) {

  if (!video) {
    return null;
  }

  video = String(video).trim();


  /* ID direto */

  if (
    /^[a-zA-Z0-9_-]{11}$/.test(video)
  ) {

    return video;

  }


  /* youtube.com/watch?v= */

  let resultado = video.match(
    /youtube\.com\/watch\?v=([^&]+)/i
  );

  if (resultado) {
    return resultado[1];
  }


  /* youtu.be */

  resultado = video.match(
    /youtu\.be\/([^?&]+)/i
  );

  if (resultado) {
    return resultado[1];
  }


  /* youtube.com/embed */

  resultado = video.match(
    /youtube\.com\/embed\/([^?&]+)/i
  );

  if (resultado) {
    return resultado[1];
  }


  /* Shorts */

  resultado = video.match(
    /youtube\.com\/shorts\/([^?&]+)/i
  );

  if (resultado) {
    return resultado[1];
  }


  return null;

}


/* =========================
   VÍDEOS
========================= */

function gerarVideos(videos, titulo) {

  if (!videos) {
    return "";
  }


  /* Se for apenas um vídeo */

  if (!Array.isArray(videos)) {

    videos = [videos];

  }


  let resultado = "";


  videos.forEach(video => {

    if (!video) {
      return;
    }


    video = String(video).trim();


    if (!video) {
      return;
    }


    /* =========================
       YOUTUBE
    ========================= */

    const youtubeID =
      pegarYoutubeID(video);


    if (youtubeID) {

      resultado += `

        <div class="video-container">

          <iframe

            src="https://www.youtube.com/embed/${encodeURIComponent(youtubeID)}"

            title="${escaparHTML(titulo)}"

            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

            allowfullscreen>

          </iframe>

        </div>

      `;

      return;

    }


    /* =========================
       VÍDEO LOCAL
    ========================= */

    const videoLower =
      video.toLowerCase();


    const extensoes = [
      ".mp4",
      ".webm",
      ".ogg",
      ".mov",
      ".m4v"
    ];


    const ehVideoLocal =
      extensoes.some(
        extensao =>
          videoLower.endsWith(extensao)
      );


    if (ehVideoLocal) {

      let tipo = "video/mp4";


      if (videoLower.endsWith(".webm")) {
        tipo = "video/webm";
      }

      else if (videoLower.endsWith(".ogg")) {
        tipo = "video/ogg";
      }

      else if (videoLower.endsWith(".mov")) {
        tipo = "video/quicktime";
      }


      resultado += `

        <div class="video-container">

          <video

            controls

            preload="metadata"

            playsinline>

            <source

              src="${escaparHTML(video)}"

              type="${tipo}">

            Seu navegador não suporta vídeos.

          </video>

        </div>

      `;

    }

  });


  if (!resultado) {
    return "";
  }


  return `

    <div class="videos-container">

      ${resultado}

    </div>

  `;

}


/* =========================
   CARREGAR NOTÍCIA
========================= */

fetch("posts.json")

  .then(response => {

    if (!response.ok) {

      throw new Error(
        "Não foi possível carregar posts.json"
      );

    }

    return response.json();

  })


  .then(posts => {


    /* =========================
       PROCURAR NOTÍCIA
    ========================= */

    const post =
      posts.find(
        noticia =>
          noticia.id === id
      );


    /* =========================
       NOTÍCIA NÃO ENCONTRADA
    ========================= */

    if (!post) {

      document.getElementById(
        "article"
      ).innerHTML = `

        <h1>
          Notícia não encontrada
        </h1>

        <p class="summary">

          O endereço dessa notícia
          não existe ou o ID está incorreto.

        </p>

        <a
          class="back-button"
          href="index.html">

          ← Voltar para as notícias

        </a>

      `;

      return;

    }


    /* =========================
       TÍTULO DA ABA
    ========================= */

    document.title =
      post.titulo +
      " - CavaloGameNews";


    /* =========================
       CONTEÚDO
    ========================= */

    let conteudoHTML = "";


    if (
      Array.isArray(post.conteudo) &&
      post.conteudo.length > 0
    ) {

      conteudoHTML =
        post.conteudo
          .map(paragrafo => `

            <p>
              ${escaparHTML(paragrafo)}
            </p>

          `)
          .join("");

    }

    else if (post.resumo) {

      conteudoHTML = `

        <p>
          ${escaparHTML(post.resumo)}
        </p>

      `;

    }


    /* =========================
       VÍDEOS
    ========================= */

    let videosHTML = "";


    if (
      Array.isArray(post.videos) &&
      post.videos.length > 0
    ) {

      videosHTML =
        gerarVideos(
          post.videos,
          post.titulo
        );

    }

    else if (post.video) {

      videosHTML =
        gerarVideos(
          [post.video],
          post.titulo
        );

    }


    /* =========================
       HTML DA NOTÍCIA
    ========================= */

    document.getElementById(
      "article"
    ).innerHTML = `

      <div class="category">

        ${escaparHTML(post.categoria)}

      </div>


      <h1>

        ${escaparHTML(post.titulo)}

      </h1>


      <div class="info">

        ${escaparHTML(post.data)}
        ·
        CavaloGameNews

      </div>


      <img

        class="cover"

        src="${escaparHTML(post.imagem)}"

        alt="${escaparHTML(post.titulo)}"

      >


      <div class="summary">

        ${escaparHTML(post.resumo || "")}

      </div>


      ${videosHTML}


      <div class="text">

        ${conteudoHTML}


        <a

          class="back-button"

          href="index.html">

          ← Voltar para as notícias

        </a>


        <div class="related">

          <h2>
            Mais notícias
          </h2>


          <div
            id="related-grid"
            class="related-grid">
          </div>

        </div>

      </div>

    `;


    /* =========================
       NOTÍCIAS RELACIONADAS
    ========================= */

    const relatedPosts =
      posts

        .filter(
          noticia =>
            noticia.id !== post.id
        )

        .slice(0, 3);


    const relatedGrid =
      document.getElementById(
        "related-grid"
      );


    relatedPosts.forEach(
      related => {

        relatedGrid.innerHTML += `

          <a

            href="post.html?id=${encodeURIComponent(related.id)}"

            class="related-card">

            <img

              src="${escaparHTML(related.imagem)}"

              alt="${escaparHTML(related.titulo)}"

            >


            <div class="related-content">

              <div class="category">

                ${escaparHTML(related.categoria)}

              </div>


              <h3>

                ${escaparHTML(related.titulo)}

              </h3>

            </div>

          </a>

        `;

      }

    );

  })


  /* =========================
     ERRO
  ========================= */

  .catch(error => {

    console.error(error);


    document.getElementById(
      "article"
    ).innerHTML = `

      <h1>
        Erro ao carregar a notícia
      </h1>

      <p class="summary">

        Verifique se o arquivo
        <strong>posts.json</strong>
        está na mesma pasta que o
        <strong>post.html</strong>.

      </p>

      <a
        class="back-button"
        href="index.html">

        ← Voltar para as notícias

      </a>

    `;

  });

</script>

</body>

</html>

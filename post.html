<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CavaloGameNews</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: #fff;
    }

    header {
      background: #0f1115;
      padding: 20px 30px;
      border-bottom: 3px solid #00ff88;
    }

    header a {
      color: #00ff88;
      text-decoration: none;
      font-weight: bold;
    }

    .article {
      width: 90%;
      max-width: 1000px;
      margin: 40px auto;
    }

    .category {
      color: #00ff88;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 46px;
      line-height: 1.15;
      margin-bottom: 15px;
    }

    .info {
      color: #999;
      margin-bottom: 25px;
    }

    .cover {
      width: 100%;
      max-height: 560px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      margin-bottom: 30px;
    }

    .text {
      max-width: 800px;
      margin: auto;
    }

    .text p {
      color: #ddd;
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .back-button {
      display: inline-block;
      margin-top: 20px;
      background: #00ff88;
      color: #111;
      padding: 12px 20px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }

    .related {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid #333;
    }

    .related h2 {
      color: #00ff88;
      margin-bottom: 20px;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .related-card {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      display: block;
    }

    .related-card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
    }

    .related-content {
      padding: 12px;
    }

    .related-content h3 {
      font-size: 17px;
      margin-top: 6px;
    }

    .related-card:hover {
      border-color: #00ff88;
      transform: translateY(-3px);
      transition: 0.2s;
    }

    footer {
      background: #1a1a1a;
      text-align: center;
      padding: 25px;
      margin-top: 50px;
      color: #888;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 30px;
      }

      .article {
        width: 92%;
      }

      .text p {
        font-size: 16px;
      }
    }
    nav a {
  transition: 0.2s;
}

nav a:hover {
  color: #00ff88;
  transform: translateY(-2px);
}
    .card {
  transition: 0.25s;
}

.card:hover {
  transform: translateY(-5px);
  border-color: #00ff88;
  box-shadow: 0 8px 20px rgba(0, 255, 136, 0.15);
}
    #topButton {
  display: none;
  position: fixed;
  bottom: 25px;
  right: 25px;
  width: 45px;
  height: 45px;
  border: none;
  border-radius: 50%;
  background: #00ff88;
  color: #111;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  z-index: 999;
}

#topButton:hover {
  transform: translateY(-3px);
  box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
}
  </style>
</head>

<body>

<header>
  <a href="index.html">← Voltar para o CavaloGameNews</a>
</header>

<main class="article" id="article">
  <p>Carregando notícia...</p>
</main>

<footer>
  © 2026 CavaloGameNews - Todos os direitos reservados.
</footer>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch("posts.json")
  .then(response => response.json())
  .then(posts => {

    const post = posts.find(p => p.id === id);

    if (!post) {
      document.getElementById("article").innerHTML = `
        <h1>Notícia não encontrada</h1>

        <a class="back-button" href="index.html">
          ← Voltar para as notícias
        </a>
      `;
      return;
    }

    document.title = post.titulo + " - CavaloGameNews";

    document.getElementById("article").innerHTML = `

      <div class="category">
        ${post.categoria}
      </div>

      <h1>
        ${post.titulo}
      </h1>

      <div class="info">
        ${post.data} · CavaloGameNews
      </div>

      <img
        class="cover"
        src="${post.imagem}"
        alt="${post.titulo}"
      >

      <div class="text">

        ${(post.conteudo || [post.resumo]).map(paragrafo => `
          <p>${paragrafo}</p>
        `).join("")}

        <a class="back-button" href="index.html">
          ← Voltar para as notícias
        </a>

        <div id="related" class="related">
          <h2>Mais notícias</h2>
          <div id="related-grid" class="related-grid"></div>
        </div>

      </div>
    `;

    // Escolhe outras notícias, sem mostrar a notícia atual
    const relatedPosts = posts
      .filter(p => p.id !== post.id)
      .slice(0, 3);

    const relatedGrid = document.getElementById("related-grid");

    relatedPosts.forEach(related => {

      relatedGrid.innerHTML += `
        <a
          href="post.html?id=${related.id}"
          class="related-card"
        >

          <img
            src="${related.imagem}"
            alt="${related.titulo}"
          >

          <div class="related-content">

            <div class="category">
              ${related.categoria}
            </div>

            <h3>
              ${related.titulo}
            </h3>

          </div>

        </a>
      `;

    });

  })
  .catch(() => {

    document.getElementById("article").innerHTML = `
      <h1>Erro ao carregar a notícia</h1>

      <a class="back-button" href="index.html">
        ← Voltar para as notícias
      </a>
    `;

  });
window.addEventListener("scroll", function () {
  const botao = document.getElementById("topButton");

  if (window.scrollY > 300) {
    botao.style.display = "block";
  } else {
    botao.style.display = "none";
  }
});

function voltarTopo() {
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}
</script>

</body>
</html>

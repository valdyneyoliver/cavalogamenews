<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CavaloGameNews</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: #fff;
    }

    header {
      background: #0f1115;
      padding: 20px 30px;
      border-bottom: 3px solid #00ff88;
    }

    header a {
      color: #00ff88;
      text-decoration: none;
      font-weight: bold;
    }

    .article {
      width: 90%;
      max-width: 1000px;
      margin: 40px auto;
    }

    .category {
      color: #00ff88;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 46px;
      line-height: 1.15;
      margin-bottom: 15px;
    }

    .info {
      color: #999;
      margin-bottom: 25px;
    }

    .cover {
      width: 100%;
      max-height: 560px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      margin-bottom: 30px;
    }


    /* =========================
       VÍDEOS
    ========================= */

    .videos-container {
      width: 100%;
      margin: 30px 0;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-bottom: 30px;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
    }

    .video-container iframe,
    .video-container video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .video-container video {
      object-fit: contain;
    }


    /* =========================
       TEXTO
    ========================= */

    .text {
      max-width: 800px;
      margin: auto;
    }

    .text p {
      color: #ddd;
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 25px;
    }


    /* =========================
       BOTÃO VOLTAR
    ========================= */

    .back-button {
      display: inline-block;
      margin-top: 20px;
      background: #00ff88;
      color: #111;
      padding: 12px 20px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }


    /* =========================
       MAIS NOTÍCIAS
    ========================= */

    .related {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid #333;
    }

    .related h2 {
      color: #00ff88;
      margin-bottom: 20px;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
      );

      gap: 20px;
    }

    .related-card {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      display: block;
    }

    .related-card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
    }

    .related-content {
      padding: 12px;
    }

    .related-content h3 {
      font-size: 17px;
      margin-top: 6px;
    }

    .related-card:hover {
      border-color: #00ff88;
      transform: translateY(-3px);
      transition: 0.2s;
    }


    /* =========================
       RODAPÉ
    ========================= */

    footer {
      background: #1a1a1a;
      text-align: center;
      padding: 25px;
      margin-top: 50px;
      color: #888;
    }


    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 600px) {

      h1 {
        font-size: 30px;
      }

      .article {
        width: 92%;
      }

      .text p {
        font-size: 16px;
      }

    }

  </style>

</head>


<body>


<header>

  <a href="../index.html">
    ← Voltar para o CavaloGameNews
  </a>

</header>


<main
  class="article"
  id="article"
>

  <p>
    Carregando notícia...
  </p>

</main>


<footer>

  © 2026 CavaloGameNews - Todos os direitos reservados.

</footer>


<script>


/* =========================
   PEGAR ID DA NOTÍCIA
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const id =
  params.get("id");


/* =========================
   CONVERTER YOUTUBE
========================= */

function pegarYoutubeID(video) {

  if (!video) {
    return null;
  }

  video =
    String(video).trim();


  /* ID direto */

  if (
    /^[a-zA-Z0-9_-]{11}$/.test(video)
  ) {

    return video;

  }


  /* youtube.com/watch?v= */

  let resultado =
    video.match(
      /youtube\.com\/watch\?v=([^&]+)/i
    );

  if (resultado) {
    return resultado[1];
  }


  /* youtu.be */

  resultado =
    video.match(
      /youtu\.be\/([^?&]+)/i
    );

  if (resultado) {
    return resultado[1];
  }


  /* youtube.com/embed */

  resultado =
    video.match(
      /youtube\.com\/embed\/([^?&]+)/i
    );

  if (resultado) {
    return resultado[1];
  }


  /* youtube shorts */

  resultado =
    video.match(
      /youtube\.com\/shorts\/([^?&]+)/i
    );

  if (resultado) {
    return resultado[1];
  }


  return null;

}


/* =========================
   CRIAR VÍDEOS
========================= */

function criarVideos(videos, titulo) {

  if (!videos) {
    return "";
  }


  /* Se for apenas um vídeo */

  if (!Array.isArray(videos)) {

    videos = [videos];

  }


  let resultado = "";


  videos.forEach(video => {

    if (!video) {
      return;
    }


    video =
      String(video).trim();


    /* =========================
       YOUTUBE
    ========================= */

    const youtubeID =
      pegarYoutubeID(video);


    if (youtubeID) {

      resultado += `

        <div class="video-container">

          <iframe

            src="https://www.youtube.com/embed/${youtubeID}"

            title="${titulo}"

            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

            allowfullscreen>

          </iframe>

        </div>

      `;

      return;

    }


    /* =========================
       VÍDEO LOCAL
    ========================= */

    const extensoes = [
      ".mp4",
      ".webm",
      ".ogg",
      ".mov",
      ".m4v"
    ];


    const ehVideoLocal =
      extensoes.some(
        extensao =>
          video.toLowerCase().endsWith(extensao)
      );


    if (ehVideoLocal) {

      let caminho = video;


      /*
        Como o post está dentro de:

        /noticias/

        precisamos voltar uma pasta
        para encontrar:

        /videos/
      */

      if (
        !video.startsWith("http://") &&
        !video.startsWith("https://") &&
        !video.startsWith("../")
      ) {

        caminho =
          "../" + video;

      }


      let tipo = "video/mp4";


      if (
        video.toLowerCase().endsWith(".webm")
      ) {

        tipo = "video/webm";

      }

      else if (
        video.toLowerCase().endsWith(".ogg")
      ) {

        tipo = "video/ogg";

      }

      else if (
        video.toLowerCase().endsWith(".mov")
      ) {

        tipo = "video/quicktime";

      }


      resultado += `

        <div class="video-container">

          <video

            controls

            preload="metadata"

            playsinline>

            <source

              src="${caminho}"

              type="${tipo}">

            Seu navegador não suporta vídeos.

          </video>

        </div>

      `;

    }

  });


  if (!resultado) {
    return "";
  }


  return `

    <div class="videos-container">

      ${resultado}

    </div>

  `;

}


/* =========================
   CARREGAR NOTÍCIA
========================= */

fetch("../posts.json")

  .then(response => {

    if (!response.ok) {

      throw new Error(
        "Erro ao carregar posts.json"
      );

    }

    return response.json();

  })


  .then(posts => {


    const post =
      posts.find(
        p => p.id === id
      );


    /* =========================
       NOTÍCIA NÃO ENCONTRADA
    ========================= */

    if (!post) {

      document.getElementById(
        "article"
      ).innerHTML = `

        <h1>
          Notícia não encontrada
        </h1>

        <a
          class="back-button"
          href="../index.html"
        >
          ← Voltar para as notícias
        </a>

      `;

      return;

    }


    /* =========================
       TÍTULO DA PÁGINA
    ========================= */

    document.title =
      post.titulo +
      " - CavaloGameNews";


    /* =========================
       VÍDEOS
    ========================= */

    let videos = "";


    if (
      post.videos &&
      Array.isArray(post.videos)
    ) {

      videos =
        criarVideos(
          post.videos,
          post.titulo
        );

    }

    else if (post.video) {

      videos =
        criarVideos(
          [post.video],
          post.titulo
        );

    }


    /* =========================
       CONTEÚDO
    ========================= */

    let conteudo = "";


    if (
      post.conteudo &&
      Array.isArray(post.conteudo)
    ) {

      conteudo =
        post.conteudo
          .map(paragrafo => `

            <p>
              ${paragrafo}
            </p>

          `)
          .join("");

    }

    else if (post.resumo) {

      conteudo = `

        <p>
          ${post.resumo}
        </p>

      `;

    }


    /* =========================
       MOSTRAR NOTÍCIA
    ========================= */

    document.getElementById(
      "article"
    ).innerHTML = `

      <div class="category">

        ${post.categoria}

      </div>


      <h1>

        ${post.titulo}

      </h1>


      <div class="info">

        ${post.data}
        ·
        CavaloGameNews

      </div>


      <img

        class="cover"

        src="${post.imagem}"

        alt="${post.titulo}"

      >


      ${videos}


      <div class="text">


        ${conteudo}


        <a

          class="back-button"

          href="../index.html"

        >

          ← Voltar para as notícias

        </a>


        <div
          id="related"
          class="related"
        >

          <h2>
            Mais notícias
          </h2>


          <div
            id="related-grid"
            class="related-grid"
          ></div>

        </div>


      </div>

    `;


    /* =========================
       MAIS NOTÍCIAS
    ========================= */

    const relatedPosts =
      posts

        .filter(
          p => p.id !== post.id
        )

        .slice(0, 3);


    const relatedGrid =
      document.getElementById(
        "related-grid"
      );


    relatedPosts.forEach(
      related => {

        relatedGrid.innerHTML += `

          <a

            href="post.html?id=${related.id}"

            class="related-card"

          >

            <img

              src="${related.imagem}"

              alt="${related.titulo}"

            >


            <div
              class="related-content"
            >

              <div class="category">

                ${related.categoria}

              </div>


              <h3>

                ${related.titulo}

              </h3>

            </div>

          </a>

        `;

      }

    );

  })


  /* =========================
     ERRO
  ========================= */

  .catch(error => {

    console.error(error);


    document.getElementById(
      "article"
    ).innerHTML = `

      <h1>
        Erro ao carregar a notícia
      </h1>


      <p style="color:#aaa;margin-top:15px;">

        Verifique se o arquivo
        <strong>posts.json</strong>
        está funcionando.

      </p>


      <a

        class="back-button"

        href="../index.html"

      >

        ← Voltar para as notícias

      </a>

    `;

  });


</script>


</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CavaloGameNews</title>

  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #111;
  color: #fff;
}

/* =========================
   CABEÇALHO
========================= */

header {
  background: #1a1a1a;
  padding: 8px 20px;
  border-bottom: 3px solid #00ff88;
}

header img {
  height: 120px;
  width: auto;
  display: block;
}

nav {
  margin-top: 5px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}

nav a {
  color: #fff;
  text-decoration: none;
  font-weight: bold;
}

nav a:hover {
  color: #00ff88;
}

/* =========================
   BUSCA
========================= */

.search-box {
  width: 100%;
  margin-bottom: 5px;
}

.search-box input {
  width: 100%;
  max-width: 450px;
  padding: 12px 16px;
  background: #1b1b1b;
  color: #fff;
  border: 1px solid #333;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}

.search-box input:focus {
  border-color: #00ff88;
}

.search-box input::placeholder {
  color: #888;
}

/* =========================
   HERO
========================= */

.hero {
  background: linear-gradient(90deg, #00ff88, #007744);
  padding: 40px 20px;
  text-align: center;
  color: #111;
}

.hero h2 {
  margin-bottom: 10px;
}

/* =========================
   CONTAINER
========================= */

.container {
  width: 90%;
  max-width: 1100px;
  margin: 30px auto;
}

/* =========================
   NOTÍCIA PRINCIPAL
========================= */

.featured-link {
  text-decoration: none;
  color: inherit;
  display: block;
}

.featured {
  position: relative;
  height: 430px;
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 30px;
  background: #1b1b1b;
}

.featured img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: 0.3s;
}

.featured-overlay {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 35px;
  background: linear-gradient(
    transparent,
    rgba(0, 0, 0, 0.95)
  );
}

.featured-overlay h2 {
  font-size: 34px;
  margin: 10px 0;
  max-width: 800px;
}

.featured-overlay p {
  color: #ddd;
  max-width: 700px;
  margin-bottom: 15px;
}

.read-button {
  display: inline-block;
  background: #00ff88;
  color: #111;
  padding: 10px 18px;
  border-radius: 6px;
  font-weight: bold;
}

.featured:hover img {
  transform: scale(1.03);
}

/* =========================
   NOTÍCIAS
========================= */

.news-grid {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(260px, 1fr)
  );
  gap: 20px;
}

.news-link {
  text-decoration: none;
  color: inherit;
  display: block;
}

.card {
  background: #1b1b1b;
  border: 1px solid #333;
  border-radius: 12px;
  overflow: hidden;
  transition: 0.2s;
}

.card:hover {
  border-color: #00ff88;
  transform: translateY(-3px);
}

.card img {
  width: 100%;
  height: 170px;
  object-fit: cover;
  display: block;
}

.card-content {
  padding: 15px;
}

.category {
  color: #00ff88;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
}

.date {
  color: #aaa;
  font-size: 12px;
  margin: 6px 0 12px;
}

.card h3 {
  margin-bottom: 10px;
}

.card p {
  color: #ccc;
  line-height: 1.5;
}

/* =========================
   RODAPÉ
========================= */

footer {
  background: #1a1a1a;
  text-align: center;
  padding: 20px;
  margin-top: 40px;
  color: #aaa;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

  header {
    padding: 5px 15px;
  }

  header img {
    height: 100px;
  }

  nav {
    gap: 12px;
  }

  .featured {
    height: 380px;
  }

  .featured-overlay {
    padding: 20px;
  }

  .featured-overlay h2 {
    font-size: 24px;
  }

  .container {
    width: 92%;
  }
}
  </style>
</head>

<body>

<header>
  <a href="index.html">← Voltar para o CavaloGameNews</a>
</header>

<main class="article" id="article">
  <p>Carregando notícia...</p>
</main>

<footer>
  © 2026 CavaloGameNews - Todos os direitos reservados.
</footer>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch("posts.json")
  .then(response => response.json())
  .then(posts => {

    const post = posts.find(p => p.id === id);

    if (!post) {
      document.getElementById("article").innerHTML = `
        <h1>Notícia não encontrada</h1>

        <a class="back-button" href="index.html">
          ← Voltar para as notícias
        </a>
      `;
      return;
    }

    document.title = post.titulo + " - CavaloGameNews";

    document.getElementById("article").innerHTML = `

      <div class="category">
        ${post.categoria}
      </div>

      <h1>
        ${post.titulo}
      </h1>

      <div class="info">
        ${post.data} · CavaloGameNews
      </div>

      <img
        class="cover"
        src="${post.imagem}"
        alt="${post.titulo}"
      >

      <div class="text">

        ${(post.conteudo || [post.resumo]).map(paragrafo => `
          <p>${paragrafo}</p>
        `).join("")}

        <a class="back-button" href="index.html">
          ← Voltar para as notícias
        </a>

        <div id="related" class="related">
          <h2>Mais notícias</h2>
          <div id="related-grid" class="related-grid"></div>
        </div>

      </div>
    `;

    // Escolhe outras notícias, sem mostrar a notícia atual
    const relatedPosts = posts
      .filter(p => p.id !== post.id)
      .slice(0, 3);

    const relatedGrid = document.getElementById("related-grid");

    relatedPosts.forEach(related => {

      relatedGrid.innerHTML += `
        <a
          href="post.html?id=${related.id}"
          class="related-card"
        >

          <img
            src="${related.imagem}"
            alt="${related.titulo}"
          >

          <div class="related-content">

            <div class="category">
              ${related.categoria}
            </div>

            <h3>
              ${related.titulo}
            </h3>

          </div>

        </a>
      `;

    });

  })
  .catch(() => {

    document.getElementById("article").innerHTML = `
      <h1>Erro ao carregar a notícia</h1>

      <a class="back-button" href="index.html">
        ← Voltar para as notícias
      </a>
    `;

  });
</script>

</body>
</html>

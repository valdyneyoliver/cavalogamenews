<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CavaloGameNews</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: #fff;
    }

    header {
      background: #0f1115;
      padding: 20px 30px;
      border-bottom: 3px solid #00ff88;
    }

    header a {
      color: #00ff88;
      text-decoration: none;
      font-weight: bold;
    }

    .article {
      width: 90%;
      max-width: 1000px;
      margin: 40px auto;
    }

    .category {
      color: #00ff88;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 46px;
      line-height: 1.15;
      margin-bottom: 15px;
    }

    .info {
      color: #999;
      margin-bottom: 25px;
    }

    .cover {
      width: 100%;
      max-height: 560px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      margin-bottom: 30px;
    }

    /* =========================
       VÍDEOS
    ========================= */

    .videos-container {
      width: 100%;
      margin: 30px 0;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-bottom: 30px;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
    }

    .video-container iframe,
    .video-container video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .video-container video {
      object-fit: contain;
    }

    .video-title {
      color: #aaa;
      font-size: 14px;
      margin: -20px 0 25px;
    }

    /* =========================
       TEXTO
    ========================= */

    .text {
      max-width: 800px;
      margin: auto;
    }

    .text p {
      color: #ddd;
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .text h2 {
      color: #00ff88;
      font-size: 28px;
      margin: 35px 0 20px;
    }

    .text h3 {
      color: #fff;
      font-size: 23px;
      margin: 30px 0 15px;
    }

    .text ul {
      margin: 0 0 25px 25px;
      color: #ddd;
      line-height: 1.8;
    }

    .text li {
      margin-bottom: 8px;
    }

    .text img {
      max-width: 100%;
      border-radius: 12px;
      margin: 20px 0;
    }

    /* =========================
       BOTÃO VOLTAR
    ========================= */

    .back-button {
      display: inline-block;
      margin-top: 20px;
      background: #00ff88;
      color: #111;
      padding: 12px 20px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }

    .back-button:hover {
      opacity: 0.85;
    }

    /* =========================
       NOTÍCIAS RELACIONADAS
    ========================= */

    .related {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid #333;
    }

    .related h2 {
      color: #00ff88;
      margin-bottom: 20px;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
      );
      gap: 20px;
    }

    .related-card {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      display: block;
      transition: 0.2s;
    }

    .related-card:hover {
      border-color: #00ff88;
      transform: translateY(-3px);
    }

    .related-card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
    }

    .related-content {
      padding: 12px;
    }

    .related-content h3 {
      font-size: 17px;
      margin-top: 6px;
    }

    /* =========================
       RODAPÉ
    ========================= */

    footer {
      background: #1a1a1a;
      text-align: center;
      padding: 25px;
      margin-top: 50px;
      color: #888;
    }

    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 600px) {

      h1 {
        font-size: 30px;
      }

      .article {
        width: 92%;
      }

      .text p {
        font-size: 16px;
      }

      .video-container {
        border-radius: 8px;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="index.html">
    ← Voltar para o CavaloGameNews
  </a>

</header>

<main class="article" id="article">

  <p>Carregando notícia...</p>

</main>

<footer>

  © 2026 CavaloGameNews - Todos os direitos reservados.

</footer>


<script>

/* =========================
   PEGAR ID DA NOTÍCIA
========================= */

const params = new URLSearchParams(
  window.location.search
);

const id = params.get("id");


/* =========================
   ESCAPAR HTML
   Ajuda a evitar problemas
   com títulos e textos.
========================= */

function escaparHTML(texto) {

  if (texto === null || texto === undefined) {
    return "";
  }

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   PEGAR ID DO YOUTUBE
========================= */

function pegarYoutubeID(video) {

  if (!video) {
    return null;
  }

  video = String(video).trim();

  /*
    Caso já seja apenas o ID:

    dwuZB-3FGyg
  */

  if (
    /^[a-zA-Z0-9_-]{11}$/.test(video)
  ) {

    return video;

  }


  /*
    youtube.com/watch?v=
  */

  let resultado = video.match(
    /youtube\.com\/watch\?v=([^&]+)/i
  );

  if (resultado) {
    return resultado[1];
  }


  /*
    youtu.be/
  */

  resultado = video.match(
    /youtu\.be\/([^?&]+)/i
  );

  if (resultado) {
    return resultado[1];
  }


  /*
    youtube.com/embed/
  */

  resultado = video.match(
    /youtube\.com\/embed\/([^?&]+)/i
  );

  if (resultado) {
    return resultado[1];
  }


  /*
    youtube.com/shorts/
  */

  resultado = video.match(
    /youtube\.com\/shorts\/([^?&]+)/i
  );

  if (resultado) {
    return resultado[1];
  }


  /*
    www.youtube.com
  */

  resultado = video.match(
    /www\.youtube\.com\/watch\?v=([^&]+)/i
  );

  if (resultado) {
    return resultado[1];
  }


  return null;

}


/* =========================
   VERIFICAR VÍDEO LOCAL
========================= */

function ehVideoLocal(video) {

  if (!video) {
    return false;
  }

  const valor =
    String(video)
      .trim()
      .toLowerCase();


  return (

    valor.startsWith("videos/") ||

    valor.endsWith(".mp4") ||

    valor.endsWith(".webm") ||

    valor.endsWith(".ogg") ||

    valor.endsWith(".mov") ||

    valor.endsWith(".m4v")

  );

}


/* =========================
   CORRIGIR CAMINHO DO VÍDEO
========================= */

function caminhoVideo(video) {

  if (!video) {
    return "";
  }

  video = String(video).trim();

  /*
    Como post.html está na raiz
    do site, videos/arquivo.mp4
    já está correto.
  */

  return video;

}


/* =========================
   GERAR HTML DOS VÍDEOS
========================= */

function gerarVideos(post) {

  let listaVideos = [];


  /*
    NOVO FORMATO:

    "videos": [
      "dwuZB-3FGyg",
      "videos/video.mp4"
    ]
  */

  if (
    Array.isArray(post.videos)
  ) {

    listaVideos = post.videos;

  }


  /*
    FORMATO ANTIGO:

    "video": "dwuZB-3FGyg"
  */

  else if (post.video) {

    listaVideos = [
      post.video
    ];

  }


  /*
    Não existem vídeos.
  */

  if (
    !Array.isArray(listaVideos) ||
    listaVideos.length === 0
  ) {

    return "";

  }


  let html = `
    <div class="videos-container">
  `;


  listaVideos.forEach(
    (video, index) => {

      if (!video) {
        return;
      }

      video =
        String(video).trim();


      /*
        ========================
        VÍDEO LOCAL
        ========================
      */

      if (
        ehVideoLocal(video)
      ) {

        const caminho =
          caminhoVideo(video);


        html += `

          <div class="video-container">

            <video
              controls
              preload="metadata"
              playsinline
            >

              <source
                src="${escaparHTML(caminho)}"
              >

              Seu navegador não suporta
              vídeos HTML5.

            </video>

          </div>

        `;

        return;

      }


      /*
        ========================
        YOUTUBE
        ========================
      */

      const youtubeID =
        pegarYoutubeID(video);


      if (youtubeID) {

        html += `

          <div class="video-container">

            <iframe

              src="https://www.youtube.com/embed/${escaparHTML(youtubeID)}"

              title="${escaparHTML(post.titulo)}"

              loading="lazy"

              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

              allowfullscreen>

            </iframe>

          </div>

        `;

        return;

      }


      /*
        ========================
        CASO NÃO RECONHEÇA
        ========================
      */

      console.warn(
        "Vídeo não reconhecido:",
        video
      );

    }
  );


  html += `
    </div>
  `;


  return html;

}


/* =========================
   GERAR CONTEÚDO
========================= */

function gerarConteudo(post) {

  if (
    !Array.isArray(post.conteudo) ||
    post.conteudo.length === 0
  ) {

    return `
      <p>
        ${escaparHTML(post.resumo || "")}
      </p>
    `;

  }


  let html = "";


  post.conteudo.forEach(item => {


    /*
      Se for texto simples:

      "Meu texto..."
    */

    if (
      typeof item === "string"
    ) {

      html += `
        <p>
          ${escaparHTML(item)}
        </p>
      `;

      return;

    }


    /*
      Se for objeto
    */

    if (
      typeof item !== "object" ||
      item === null
    ) {

      return;

    }


    const tipo =
      String(
        item.tipo || "texto"
      ).toLowerCase();


    /*
      PARÁGRAFO
    */

    if (
      tipo === "texto" ||
      tipo === "paragrafo"
    ) {

      html += `
        <p>
          ${escaparHTML(item.texto || "")}
        </p>
      `;

    }


    /*
      TÍTULO
    */

    else if (
      tipo === "titulo"
    ) {

      html += `
        <h2>
          ${escaparHTML(item.texto || "")}
        </h2>
      `;

    }


    /*
      SUBTÍTULO
    */

    else if (
      tipo === "subtitulo"
    ) {

      html += `
        <h3>
          ${escaparHTML(item.texto || "")}
        </h3>
      `;

    }


    /*
      IMAGEM
    */

    else if (
      tipo === "imagem"
    ) {

      const imagem =
        item.imagem || "";

      const legenda =
        item.legenda || "";


      if (imagem) {

        html += `

          <figure>

            <img
              src="${escaparHTML(imagem)}"
              alt="${escaparHTML(legenda)}"
              loading="lazy"
            >

            ${
              legenda
                ? `
                  <figcaption>
                    ${escaparHTML(legenda)}
                  </figcaption>
                `
                : ""
            }

          </figure>

        `;

      }

    }


    /*
      LISTA
    */

    else if (
      tipo === "lista"
    ) {

      const itens =
        Array.isArray(item.itens)
          ? item.itens
          : [];


      if (itens.length > 0) {

        html += "<ul>";


        itens.forEach(
          listaItem => {

            html += `
              <li>
                ${escaparHTML(listaItem)}
              </li>
            `;

          }
        );


        html += "</ul>";

      }

    }

  });


  return html;

}


/* =========================
   CARREGAR NOTÍCIA
========================= */

fetch("posts.json")

  .then(response => {

    if (!response.ok) {

      throw new Error(
        "Não foi possível carregar posts.json"
      );

    }

    return response.json();

  })

  .then(posts => {


    /*
      Procurar notícia pelo ID
    */

    const post =
      posts.find(
        p => String(p.id) === String(id)
      );


    /*
      NOTÍCIA NÃO ENCONTRADA
    */

    if (!post) {

      document.getElementById(
        "article"
      ).innerHTML = `

        <h1>
          Notícia não encontrada
        </h1>

        <a
          class="back-button"
          href="index.html"
        >
          ← Voltar para as notícias
        </a>

      `;

      return;

    }


    /*
      TÍTULO DA PÁGINA
    */

    document.title =
      post.titulo +
      " - CavaloGameNews";


    /*
      VÍDEOS
    */

    const videosHTML =
      gerarVideos(post);


    /*
      CONTEÚDO
    */

    const conteudoHTML =
      gerarConteudo(post);


    /*
      IMAGEM PRINCIPAL
    */

    const imagemPrincipal =
      post.imagem
        ? `

          <img
            class="cover"
            src="${escaparHTML(post.imagem)}"
            alt="${escaparHTML(post.titulo)}"
          >

        `
        : "";


    /*
      MOSTRAR NOTÍCIA
    */

    document.getElementById(
      "article"
    ).innerHTML = `

      <div class="category">

        ${escaparHTML(
          post.categoria || "Notícias"
        )}

      </div>


      <h1>

        ${escaparHTML(
          post.titulo || "Sem título"
        )}

      </h1>


      <div class="info">

        ${escaparHTML(
          post.data || ""
        )}

        · CavaloGameNews

      </div>


      ${imagemPrincipal}


      ${videosHTML}


      <div class="text">

        ${conteudoHTML}


        <a
          class="back-button"
          href="index.html"
        >

          ← Voltar para as notícias

        </a>


        <div
          id="related"
          class="related"
        >

          <h2>
            Mais notícias
          </h2>

          <div
            id="related-grid"
            class="related-grid"
          ></div>

        </div>

      </div>

    `;


    /*
      =========================
      NOTÍCIAS RELACIONADAS
      =========================
    */

    const relatedPosts =
      posts

        .filter(
          p => p.id !== post.id
        )

        .slice(0, 3);


    const relatedGrid =
      document.getElementById(
        "related-grid"
      );


    relatedPosts.forEach(
      related => {

        relatedGrid.innerHTML += `

          <a

            href="post.html?id=${encodeURIComponent(related.id)}"

            class="related-card"

          >

            <img

              src="${escaparHTML(
                related.imagem || ""
              )}"

              alt="${escaparHTML(
                related.titulo || ""
              )}"

              loading="lazy"

            >


            <div class="related-content">

              <div class="category">

                ${escaparHTML(
                  related.categoria || "Notícias"
                )}

              </div>


              <h3>

                ${escaparHTML(
                  related.titulo || ""
                )}

              </h3>

            </div>

          </a>

        `;

      }
    );

  })


  /*
    =========================
    ERRO
    =========================
  */

  .catch(error => {

    console.error(
      "Erro:",
      error
    );


    document.getElementById(
      "article"
    ).innerHTML = `

      <h1>
        Erro ao carregar a notícia
      </h1>

      <p
        style="
          color:#aaa;
          margin-top:15px;
        "
      >
        Verifique se o arquivo
        posts.json está disponível.
      </p>


      <a
        class="back-button"
        href="index.html"
      >

        ← Voltar para as notícias

      </a>

    `;

  });

</script>

</body>
</html>

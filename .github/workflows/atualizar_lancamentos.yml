name: Atualizar calendário de lançamentos

on:
  schedule:
    # Executa todos os dias às 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerar calendário
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          python scripts/gerar_lancamentos.py

      - name: Verificar lancamentos.json
        run: |
          echo "Arquivos na raiz:"
          ls -la

          echo ""
          echo "Verificando lancamentos.json..."

          if [ -f "lancamentos.json" ]; then
            echo "✅ lancamentos.json foi criado!"
            echo "Tamanho:"
            wc -c lancamentos.json

            echo ""
            echo "Primeiras linhas:"
            head -30 lancamentos.json
          else
            echo "❌ ERRO: lancamentos.json NÃO foi criado!"
            exit 1
          fi

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lancamentos.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no calendário."
          else
            git commit -m "Atualizar calendário de lançamentos"
            git push
          fi

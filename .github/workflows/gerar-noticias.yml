name: Gerar páginas das notícias

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerar páginas
        run: |
          python scripts/gerar_noticias.py

      - name: Salvar páginas geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias/

          git diff --cached --quiet || git commit -m "Gerar páginas das notícias"

          git push

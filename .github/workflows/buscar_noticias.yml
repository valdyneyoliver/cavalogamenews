name: Buscar notícias do PXN Games

on:
  schedule:
    - cron: "0 11,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Buscar notícias
        run: python scripts/buscar_noticias.py

      - name: Salvar notícias pendentes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias_pendentes.json
          git diff --cached --quiet || git commit -m "Bot: notícias pendentes do PXN Games"
          git push

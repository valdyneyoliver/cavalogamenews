name: Bot Jogos Grátis

on:
  schedule:
    # Executa todos os dias às 12:00 no horário de Brasília
    - cron: "0 10 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  jogos-gratis:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Executar bot de jogos grátis
        run: |
          python scripts/bot_jogos_gratis.py

      - name: Gerar páginas das notícias
        run: |
          python scripts/gerar_noticias.py

      - name: Salvar somente as notícias novas e os arquivos principais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Atualiza o arquivo principal e o sitemap.
          git add posts.json sitemap.xml

          # Adiciona somente páginas HTML novas (não modifica páginas antigas).
          git ls-files --others --exclude-standard -z noticias/ | xargs -0 -r git add --

          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
          else
            git commit -m "Adicionar jogos grátis"
            git push
          fi

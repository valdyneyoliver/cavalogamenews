name: Atualizar Radar de Games

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar e traduzir notícias
        run: python bot_radar.py
      - name: Salvar radar.json no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza Radar de Games"
            git push
          fi
